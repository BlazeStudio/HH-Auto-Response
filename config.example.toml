# Скопируйте этот файл в config.toml и поправьте под себя.

# Ссылка на поиск вакансий hh.ru. Удобнее всего взять её со страницы резюме:
# «Мои резюме» → «N подходящих вакансий» — тогда в ссылке будет параметр resume=<ID резюме>.
search_url = "https://hh.ru/search/vacancy?resume=ВАШ_ID_РЕЗЮМЕ&from=resumelist"

# Ссылка на резюме для проверки (https://hh.ru/resume/<ID>).
# Можно оставить пустой — тогда ID берётся из параметра resume= в search_url.
resume_url = ""

# Если в окне отклика hh подставил другое резюме — пропускать вакансию.
skip_on_resume_mismatch = true

[search]
# Откуда брать вакансии:
#   "resume" — по ссылке search_url выше (обычно «подходящие к резюме»);
#   "query"  — общий поиск hh по тексту query (как в строке поиска на hh.ru)
mode = "resume"
query = ""                 # например: "python разработчик" или "backend OR бэкенд"
area = ""                  # регион hh: "1" — Москва, "2" — Санкт-Петербург, "113" — вся Россия; "" — как в профиле
title_only = false         # true — искать запрос только в названии вакансии

[limits]
max_responses = 200        # откликов за один запуск (у hh лимит — около 200 в сутки)
max_pages = 40             # страниц выдачи
delay_min = 2              # пауза между вакансиями, сек (случайная в диапазоне)
delay_max = 7
page_delay_min = 3         # пауза перед следующей страницей выдачи
page_delay_max = 7
action_delay_min = 0.6     # пауза между кликами внутри одной вакансии
action_delay_max = 1.6
max_consecutive_errors = 5 # столько ошибок подряд → аварийная остановка

[hh_filters]
# Фильтры самого hh — подставляются в ссылку поиска вместо тех, что в ней есть. Пусто / 0 / false — фильтр
# не задан: на hh это «выбрано всё». Проще всего настроить фильтры на hh.ru, скопировать адрес страницы
# и в приложении нажать «Настройки» → «Фильтры hh» → «Заполнить из ссылки hh».
order_by = ""              # "" — по соответствию; "publication_time" по дате; "salary_desc" / "salary_asc"
                           # по убыванию / возрастанию зарплаты; "distance" по удалённости от дома
search_period = 0          # 0 — за всё время, 7 — за неделю, 3 — за три дня, 1 — за сутки
# График: FIVE_ON_TWO_OFF (5/2), SIX_ON_ONE_OFF, FOUR_ON_THREE_OFF, FOUR_ON_TWO_OFF, FOUR_ON_FOUR_OFF,
#   THREE_ON_THREE_OFF, THREE_ON_TWO_OFF, TWO_ON_TWO_OFF (2/2), TWO_ON_ONE_OFF, ONE_ON_THREE_OFF, ONE_ON_TWO_OFF,
#   WEEKEND (по выходным), FLEXIBLE (свободный), OTHER (другое)
work_schedule_by_days = []
# Рабочие часы в день: HOURS_2 … HOURS_12, HOURS_24, FLEXIBLE (по договорённости), OTHER
working_hours = []
# Опыт: noExperience, between1And3, between3And6, moreThan6
experience = []
# Формат: REMOTE (удалённо), HYBRID (гибрид), ON_SITE (на месте работодателя), FIELD_WORK (разъездной)
work_format = []
salary = 0                 # уровень дохода от, ₽; 0 — не важно
salary_mode = ""           # за что указан доход: MONTH, SHIFT (смена), HOUR, FLY_IN_FLY_OUT (вахта), SERVICE
# Частота выплат: DAILY, WEEKLY, TWICE_PER_MONTH, MONTHLY, PER_PROJECT
salary_frequency = []
# Тип занятости: FULL (полная), PART (частичная), PROJECT (подработка), FLY_IN_FLY_OUT (вахта)
employment_form = []
accept_temporary = false   # оформление по ГПХ или по совместительству
# Специализации — номера из справочника hh (в приложении выбираются по названию): 96 — программист,
# 160 — DevOps-инженер, 104 — руководитель группы разработки, 165 — дата-сайентист …
professional_role = []
# Компании — номера из ссылки hh.ru/employer/<номер> (можно вставить саму ссылку)
employer_id = []
# Отрасль компании — номера hh: "7" — ИТ, системная интеграция, интернет; подотрасль — "7.540" и т.п.
industry = []
excluded_text = ""         # слова-исключения: hh не покажет вакансии с ними
# Образование: not_required_or_not_specified (не требуется или не указано), special_secondary, higher
education = []
# Другие параметры: not_from_agency (без кадровых агентств), with_address, accept_labor_contract (трудовой договор),
#   accredited_it (аккредитованные ИТ-компании), with_salary (указан доход), internship (стажировка),
#   low_performance (меньше 10 откликов), night_shifts (вечерние/ночные смены), accept_kids (с 14 лет)
label = []
# Особенности здоровья: CHRONIC_DISEASES, MOBILITY, HEARING, VISION, MENTAL, UNSPECIFIED (категория не указана)
inclusiveness_types = []
# Где искать слова запроса (для [search] mode = "query"): name, company_name, description
search_field = []

[filters]
# Фильтры программы: проверяются по карточке вакансии, вакансия пропускается без клика.
# Слова в названии вакансии, при которых она пропускается без отклика (регистр не важен)
exclude_title_words = ["преподаватель", "куратор"]
# Слова в названии КОМПАНИИ, при которых вакансия пропускается (регистр не важен).
# Например: ["сбер", "тинькофф"] — «Сбер», «СберТех», «Сбербанк» будут пропущены
exclude_company_words = []
# Откликаться ТОЛЬКО в компании, в названии которых есть хотя бы одно из слов (регистр не важен).
# Пусто — проверка не делается. Например: ["яндекс", "тинькофф", "ozon"]
include_company_words = []
# Откликаться ТОЛЬКО на вакансии, где есть хотя бы одно из этих слов (регистр не важен).
# Пусто — откликаться на все. Например: ["python", "backend", "django"]
include_words = []
include_in_snippet = false # true — искать слова и в описании из карточки, не только в названии

[letter]
# Как писать сопроводительное письмо:
#   "generate" — кнопкой hh «Сгенерировать» (нужна подписка hh); если кнопки нет или генерация не удалась,
#                а ИИ включён ([ai] enabled) — письмо пишет нейросеть,
#   "ai"       — письмо пишет нейросеть из [ai] по резюме и описанию вакансии (подписка не нужна),
#   "template" — готовым текстом template_text (подписка не нужна),
#   "none"     — откликаться без письма (вакансии, где письмо обязательно, пропускаются)
mode = "generate"
# Текст для mode = "template". {vacancy} и {company} заменяются на название вакансии и компанию.
template_text = """Здравствуйте!

Меня заинтересовала вакансия «{vacancy}» в компании {company}. Буду рад обсудить, чем могу быть полезен.
"""
generate_timeout = 60      # сколько ждать, пока «Сгенерировать» заполнит письмо, сек
min_length = 30            # письмо короче считается несгенерированным
ai_max_chars = 900         # длина письма нейросети, символов
# Запасной текст, если генерация не удалась. Пусто — такая вакансия пропускается
# (или, если отклик уже ушёл без окна, остаётся без письма).
fallback_text = ""

[questions]
# Если работодатель задаёт ровно ОДИН вопрос и он о зарплате — отвечаем этим текстом,
# прикладываем сгенерированное письмо и откликаемся. Остальные вопросы пока пропускаются.
answer_salary = true
salary_answer = "Рассматриваю от 100"
# Если включён ИИ ([ai] enabled) — анкеты при отклике заполняет нейросеть: любые вопросы, текст и варианты.
# Зарплата и сроки — по вашему контексту ([ai] context), технологии — строго по резюме.
# Нет опыта в резюме — смежный опыт или честное «особого опыта не было»; тесты и ссылки — пропуск.
max_ai_questions = 15      # анкеты длиннее пропускаются (обычно это тесты)
# По этим словам вопрос считается вопросом о зарплате (когда ИИ выключен)
salary_keywords = ["зарплат", "заработн", "сумм", "доход", "оклад", "вознагражд", "компенсац", "з/п", "₽", "руб"]

[relocation]
# Предупреждение hh «вакансия в другом регионе/стране»: соглашаемся, если переезд не нужен.
confirm_other_region = true   # false — всегда отказываться от таких вакансий
decline_if_not_remote = true  # другой регион без «Можно удалённо» = придётся переезжать → отказ
# Слова в карточке вакансии, означающие переезд → отказ
decline_keywords = ["переезд", "переех", "релокац", "перемещ", "relocat"]

[chats]
# Для отдельного скрипта read_rejections.py: открывает непрочитанные чаты с отказами
url = "https://hh.ru/chat"
rejection_text = "Отказ"   # последнее сообщение чата, по которому узнаём отказ
delay_min = 0.5            # пауза после открытия чата, чтобы hh отметил его прочитанным
delay_max = 1.0

[ai]
# ИИ-ответы на анкеты «Робота-рекрутера» в чатах hh (python read_rejections.py или «Чаты» в приложении).
# Нейросеть получает ваше резюме с hh, контекст ниже и переписку и отвечает коротко от вашего имени.
enabled = false
# Где нейросеть (OpenAI-совместимый API):
#   "openrouter" — openrouter.ai, есть БЕСПЛАТНЫЕ модели (с пометкой :free), нужен ключ;
#   "deepseek"   — api.deepseek.com, платно, но копейки; нужен ключ с platform.deepseek.com;
#   "ollama"     — нейросеть на вашем компьютере (ollama.com), бесплатно, ключ не нужен;
#   "custom"     — любой другой: укажите base_url и model
provider = "openrouter"
api_key = ""               # ключ провайдера (или переменная окружения HH_AI_API_KEY)
model = ""                 # пусто — модель по умолчанию для провайдера
base_url = ""              # пусто — адрес провайдера. Ollama на другом компьютере: "http://192.168.1.50:11434"
                           # или "http://localhost:11435" через SSH-туннель — см. docs/ollama.md
# Что ещё знать о вас кроме резюме: зарплатные ожидания, формат, город, когда готовы выйти, и т.п.
context = ""
# false — отвечать всем (ботам и живым рекрутерам); true — только ботам hh из robot_markers.
# Встречи, собеседования и звонки, документы, контакты и деньги программа в любом случае оставляет вам.
only_robot = false
robot_markers = ["Робот-рекрутер", "ИИ-помощник", "ассистент рекрутера", "на базе AI", "на базе ИИ"]
max_answer_chars = 300     # максимальная длина одного ответа
reply_wait = 25            # сколько ждать следующего вопроса робота после ответа, сек
max_answers_per_chat = 20
timeout = 60               # сколько ждать ответа нейросети, сек

[browser]
channel = "chrome"         # chrome | msedge | "" (встроенный Chromium Playwright)
headless = false           # первый запуск — обязательно false, чтобы войти вручную
profile_dir = "browser-profile"
slow_mo = 0                # замедление каждого действия Playwright, мс (для отладки)
login_timeout = 600        # сколько ждать ручного входа, сек

[geo]
# hh.ru работает только из России. Если вы за границей или сидите через VPN —
# добавьте hh.ru в исключения VPN или укажите российский прокси:
#   "http://user:pass@1.2.3.4:8080"  или  "socks5://1.2.3.4:1080" (socks5 — без логина/пароля)
proxy = ""
locale = "ru-RU"
timezone = "Europe/Moscow"
check_ip = true            # перед стартом показать страну внешнего IP (запрос к ipinfo.io)
require_ru_ip = false      # true — не запускаться, если IP не российский

[logs]
# При ошибке программа сохраняет скриншот и HTML страницы в logs/snapshots — по ним видно, что пошло не так,
# если hh поменял вёрстку. Один снимок весит 1–3 МБ. Не нужны — поставьте false.
snapshots = true

[notify]
# Уведомление, когда запуск закончился: сколько отправлено, пропущено, ошибок. По умолчанию выключено.
desktop = false            # системное уведомление (Windows, macOS; на Linux нужен notify-send)
telegram = false           # сообщение от вашего Telegram-бота — удобно, если программа крутится на сервере
telegram_token = ""        # токен от @BotFather (можно не писать сюда, а задать HH_TELEGRAM_TOKEN)
telegram_chat_id = ""      # напишите боту и откройте https://api.telegram.org/bot<токен>/getUpdates → chat.id
