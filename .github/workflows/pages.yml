# Публикует сайт из папки site/ на GitHub Pages.
# Один раз нужно включить в настройках репозитория: Settings → Pages → Source → GitHub Actions.
# Сам запускается только при push в main с изменениями сайта. Со сборкой релиза не связан: новую версию
# и ссылки на её архивы страница берёт из GitHub API прямо в браузере (site/src/scripts/github.ts).

name: Сайт

on:
  push:
    branches: [main]
    paths:
      - site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - name: Собрать сайт
        working-directory: site
        env:
          # Адрес и подпапка из настроек Pages. Со своим доменом подпапка станет пустой
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: deployment
        uses: actions/deploy-pages@v5
