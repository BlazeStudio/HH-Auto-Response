# Сборка приложения под Windows, macOS (Apple Silicon и Intel) и Linux на машинах GitHub.
#
# Релиз: поднимите __version__ в hh_auto/__init__.py, закоммитьте, затем Releases → Draft a new release →
#   тег = эта версия (например 1.0.5-beta) → Publish release. Workflow запустится сам, соберёт все системы
#   и приложит архивы и SHA256SUMS.txt к этому релизу (~10–15 минут). Описание релиза не трогается.
#   Следом блок «Что нового» наверху README берётся из описания релиза (раздел «## Что нового в …») и
#   сохраняется в основную ветку, а если она защищена от прямых push — приходит pull request.
# Автообновление в приложении берёт именно эти файлы: архив под свою систему + SHA256SUMS.txt для проверки.
#   Поэтому тег обязан совпадать с версией в коде — иначе приложение предлагало бы обновиться по кругу.
# Пробная сборка без релиза: Actions → «Сборка» → Run workflow — архивы будут в Artifacts запуска.
name: Сборка

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # приложить архивы к релизу

concurrency:  # повторная публикация того же релиза не запускает две сборки параллельно
  group: build-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, optional: false }
          - { name: macOS Apple Silicon, os: macos-latest, optional: false }
          - { name: macOS Intel, os: macos-15-intel, optional: true }  # последний образ GitHub с Intel
          - { name: Linux, os: ubuntu-22.04, optional: false }         # старая glibc — запустится на большем числе систем
    steps:
      - uses: actions/checkout@v4

      - name: Тег релиза = версия приложения
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          app=$(sed -n 's/^__version__ = "\([^"]*\)".*/\1/p' hh_auto/__init__.py | tr -d '\r')
          if [ "${TAG#v}" != "$app" ]; then
            echo "::error::Тег $TAG не совпадает с версией приложения $app в hh_auto/__init__.py"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils libtk8.6 libxft2

      - name: Сборка
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: HH-Auto-Response-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/HH-Auto-Response-*.zip
            dist/HH-Auto-Response-*.tar.gz
          if-no-files-found: error

  release:
    name: Архивы → релиз
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Версия в именах файлов и контрольные суммы
        working-directory: dist
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          # HH-Auto-Response-windows.zip → HH-Auto-Response-1.0.4-beta-windows.zip
          for f in HH-Auto-Response-*; do
            mv "$f" "HH-Auto-Response-${version}-${f#HH-Auto-Response-}"
          done
          sha256sum HH-Auto-Response-* > SHA256SUMS.txt
          ls -la

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"

  readme:
    name: «Что нового» в README
    if: github.event_name == 'release'
    needs: release  # README обновляется, когда архивы уже приложены и релиз можно скачать
    runs-on: ubuntu-latest
    permissions:
      contents: write       # коммит README в основную ветку
      pull-requests: write  # если она защищена от прямых push — то же изменение через pull request
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Раздел «Что нового» из описания релиза
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          PYTHONIOENCODING: utf-8
        run: python packaging/update_readme.py

      - name: README → основная ветка
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- README.md; then
            echo "README уже актуален"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(readme): что нового в $TAG" -- README.md
          if git push origin "HEAD:$BASE"; then
            exit 0
          fi
          # основная ветка защищена от прямых push — предлагаем то же изменение через pull request
          branch="readme/whats-new-$TAG"
          git push --force origin "HEAD:refs/heads/$branch"
          gh pr create --base "$BASE" --head "$branch" \
            --title "README: что нового в $TAG" \
            --body "Блок «Что нового» наверху README — из описания релиза $TAG (workflow «Сборка»)."
