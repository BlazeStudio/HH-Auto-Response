# Сборка приложения под Windows, macOS (Apple Silicon и Intel) и Linux на машинах GitHub.
#
# Релиз: Releases → Draft a new release → тег вида 1.0.4-beta → Publish release.
#   Workflow запустится сам, соберёт все системы и приложит архивы и SHA256SUMS.txt к этому релизу
#   (~10–15 минут). Описание релиза не трогается.
# Пробная сборка без релиза: Actions → «Сборка» → Run workflow — архивы будут в Artifacts запуска.
name: Сборка

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write  # приложить архивы к релизу

concurrency:  # повторная публикация того же релиза не запускает две сборки параллельно
  group: build-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, optional: false }
          - { name: macOS Apple Silicon, os: macos-latest, optional: false }
          - { name: macOS Intel, os: macos-15-intel, optional: true }  # последний образ GitHub с Intel
          - { name: Linux, os: ubuntu-22.04, optional: false }         # старая glibc — запустится на большем числе систем
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils libtk8.6 libxft2

      - name: Сборка
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: HH-Auto-Response-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/HH-Auto-Response-*.zip
            dist/HH-Auto-Response-*.tar.gz
          if-no-files-found: error

  release:
    name: Архивы → релиз
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Версия в именах файлов и контрольные суммы
        working-directory: dist
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          # HH-Auto-Response-windows.zip → HH-Auto-Response-1.0.4-beta-windows.zip
          for f in HH-Auto-Response-*; do
            mv "$f" "HH-Auto-Response-${version}-${f#HH-Auto-Response-}"
          done
          sha256sum HH-Auto-Response-* > SHA256SUMS.txt
          ls -la

      - name: Приложить к релизу
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "${{ github.repository }}"
