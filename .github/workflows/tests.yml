# Проверки на всех системах: юнит-тесты, весь путь программы на макете hh и окно приложения.
# Сеть не нужна: hh и нейросеть подменены (tests/mock_hh.py), настоящих откликов нет.
# Запускается при push в любую ветку, на pull request и вручную: Actions → «Проверки» → Run workflow.
name: Проверки

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # новый push в ту же ветку отменяет недоделанную проверку старого
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Системные библиотеки (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libtk8.6 fonts-dejavu

      - name: Библиотеки
        run: python -m pip install -r requirements.txt

      - name: Браузер для макета hh
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then python -m playwright install --with-deps chromium
          else python -m playwright install chromium; fi

      - name: Компиляция и юнит-тесты
        shell: bash
        run: |
          python -m compileall -q hh_auto scripts tests
          python -m unittest discover -s tests

      - name: Весь путь на макете hh
        run: python tests/e2e_mock_hh.py

      - name: Окно приложения
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a -s "-screen 0 1400x900x24" python tests/smoke_gui.py
          else python tests/smoke_gui.py; fi
